# Python logging dictConfig. {log_dir} is substituted at startup.
version: 1
disable_existing_loggers: false
filters:
  context:
    (): utils.logger.ContextFilter
  redact:
    (): utils.logger.RedactingFilter
formatters:
  console:
    (): utils.logger.ConsoleFormatter
  json:
    (): utils.logger.JsonFormatter
handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: console
    filters: [context, redact]
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filters: [context, redact]
    filename: "{log_dir}/gateway.log"
    maxBytes: 20971520
    backupCount: 10
    encoding: utf-8
  errors:
    class: logging.handlers.RotatingFileHandler
    level: WARNING
    formatter: json
    filters: [context, redact]
    filename: "{log_dir}/gateway_errors.log"
    maxBytes: 10485760
    backupCount: 10
    encoding: utf-8
loggers:
  asyncua:
    level: WARNING
  pymodbus:
    level: WARNING
  snap7:
    level: WARNING
  pycomm3:
    level: WARNING
  uvicorn.access:
    level: WARNING
root:
  level: INFO
  handlers: [console, file, errors]
