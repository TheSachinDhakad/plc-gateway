# Multiple slaves on one RS485 bus: prefix the unit id, e.g. "5@holding:0".
tags:
  - tag_id: drive1_speed
    device_id: rtu_bus_01
    name: Drive 1 speed
    address: 1@holding:0
    data_type: UINT
    poll_interval_ms: 1000
    logging_mode: cyclic
  - tag_id: drive2_speed
    device_id: rtu_bus_01
    name: Drive 2 speed
    address: 2@holding:0
    data_type: UINT
    poll_interval_ms: 1000
    logging_mode: cyclic
